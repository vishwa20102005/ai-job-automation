name: CareerPilot AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot123
          POSTGRES_DB: careerpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ruff lint
        working-directory: backend
        run: ruff check app/ tests/ --select=E,F,W --ignore=E501

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://careerpilot:careerpilot123@localhost:5432/careerpilot_test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters
          ENVIRONMENT: test
        run: |
          python -m pytest tests/ -v --tb=short --no-header -q

  frontend-test:
    name: Frontend Tests (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.careerpilot.example.com
        run: npm run build
